# HTTP (80) para o computador local e HTTPS (443) para acessar pelo celular na rede.
# Fora de localhost o navegador só libera a câmera em HTTPS, então quem abre por HTTP
# usando o IP (ex.: celular em http://192.168.0.6:31910) é redirecionado para o HTTPS.
# 31911 é a porta publicada no host para o 443 (docker/demo.compose.yml).

map $host $needs_https {
    default      1;
    localhost    0;
    127.0.0.1    0;
    "[::1]"      0;
}

server {
    listen 80;
    if ($needs_https) { return 302 https://$host:31911$request_uri; }
    include /etc/nginx/conf.d/demo-site.inc;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/demo.crt;
    ssl_certificate_key /etc/nginx/certs/demo.key;
    include /etc/nginx/conf.d/demo-site.inc;
}
