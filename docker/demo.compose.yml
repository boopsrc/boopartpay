# Página de demonstração do reconhecimento facial (pasta ../demo).
# A câmera só funciona em contexto seguro:
#   - no computador: http://localhost:31910
#   - no celular (mesma rede): https://<IP-do-computador>:31911 (certificado autoassinado;
#     o navegador avisa uma vez, aceite para continuar)
services:
  boopdemo:
    build: ../demo
    image: boopdemo:latest
    container_name: boopdemo
    restart: unless-stopped
    ports:
      - "31910:80"
      - "31911:443"
    volumes:
      - boopdemo-certs:/etc/nginx/certs

volumes:
  boopdemo-certs:
